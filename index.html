<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Card Tycoon</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #533483);
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
    color: white;
    text-align: center;
    padding: 20px;
}

@keyframes gradientMove {
    0% { background-position:0% 50%; }
    50% { background-position:100% 50%; }
    100% { background-position:0% 50%; }
}

h1 {
    margin-bottom: 20px;
}

#gold-info {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 20px;
}

.section-title {
    margin-top: 25px;
    margin-bottom: 10px;
}

.shop-container,
.slots-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.card-entry {
    width: 180px;
    background: white;
    color: black;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

.card-entry.rzadka {
    border: 3px solid #3498db;
    background: #eaf2f8;
}

.card-entry.epicka {
    border: 3px solid #9b59b6;
    background: #f4ecf7;
}

.card-entry img {
    width: 150px;
    height: 200px;
    border-radius: 6px;
    object-fit: cover;
}

.owned-card {
    background: white;
    color: black;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

.owned-card.rzadka {
    border: 3px solid #3498db;
}

.owned-card.epicka {
    border: 3px solid #9b59b6;
}

.owned-card.level2 {
    background: #c0c0c0;
    color: black;
}

.owned-card.level3 {
    background: linear-gradient(
        135deg,
        #ffd700,
        #ffec80,
        #ffd700
    );
    color: black;
}

button {
    margin-top: 8px;
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.buy-btn {
    background: gold;
}

.slot {
    width: 180px;
    min-height: 290px;
    background: rgba(255,255,255,0.08);
    border: 2px dashed rgba(255,255,255,0.3);
    border-radius: 10px;
    padding: 10px;
}

.slot.rzadka {
    border-color: #3498db;
    background: rgba(52, 152, 219, 0.1);
}

.slot.epicka {
    border-color: #9b59b6;
    background: rgba(155, 89, 182, 0.1);
}

.collect-btn {
    background: limegreen;
    color: white;
    font-size: 18px;
    padding: 12px 20px;
}

.unlock-btn {
    background: orange;
}

.rebirth-btn {
    background: #e74c3c;
    color: white;
    font-size: 16px;
    padding: 10px 20px;
    box-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
}

.shop-toggle-btn {
    background: #8e44ad;
    color: white;
    font-size: 14px;
    padding: 8px 16px;
    margin-left: 10px;
}

/* Kontener na przyciski w rogu ekranu */
.corner-container {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 1000;
}

.corner-button {
    background: #3498db;
    color: white;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0,0,0,.35);
    transition: .2s;
    margin-top: 0;
}

.corner-button.gwent {
    background: #27ae60;
}

.corner-button.gwent:hover {
    background: #219150;
}

.corner-button:hover {
    transform: scale(1.05);
    background: #2980b9;
}

</style>
</head>
<body>

<h1>🏆 Card Tycoon</h1>

<div class="corner-container">
    <button
    class="corner-button"
    onclick="window.location.href='https://czopokoarty2.netlify.app/';">
    🏠 CZOPOKARTY
    </button>
    <button
    class="corner-button gwent"
    onclick="window.location.href='https://czopogwint.netlify.app/';">
    ⚔️ GWINT
    </button>
</div>

<div id="gold-info">💰 Złoto: 0</div>
<div id="income-info" style="font-size: 18px; margin-bottom: 20px; color: #2ecc71; font-weight: bold;">
    📈 Przychód: 0 zł / h
</div>

<div style="margin-bottom: 20px;">
    <button
    id="collect-btn"
    class="collect-btn"
    onclick="collectGold()">
    💰 Zbierz złoto (0)
    </button>
    <button
    id="rebirth-btn"
    class="rebirth-btn"
    onclick="doRebirth()">
    🔄 Rebirth 1
    </button>
</div>

<h2 class="section-title">🛒 Sklep (<span id="shop-type-title">Zwykły</span>)</h2>
<div style="margin-bottom: 15px;">
    <button
    onclick="refreshShop()"
    style="background:dodgerblue;color:white;">
    🔄 Odśwież sklep (500 zł)
    </button>
    <button
    id="toggle-shop-btn"
    class="shop-toggle-btn"
    onclick="toggleShop()"
    style="display:none;">
    🏪 Przełącz sklep
    </button>
</div>

<div id="shop" class="shop-container"></div>

<div id="epic-slots-section" style="display:none;">
    <h2 class="section-title">🔮 Twoje miejsca (Epickie)</h2>
    <div id="slots-epic" class="slots-container"></div>
</div>

<div id="rare-slots-section" style="display:none;">
    <h2 class="section-title">⭐ Twoje miejsca (Rzadkie)</h2>
    <div id="slots-rare" class="slots-container"></div>
</div>

<h2 class="section-title">🏠 Twoje miejsca (Zwykłe)</h2>
<div id="slots-normal" class="slots-container"></div>

<script>

// Helper do formatowania waluty (1000 -> 1k, 2500 -> 2,5k)
function formatNumber(num) {
    if (num >= 1000) {
        let formatted = (num / 1000).toFixed(1);
        if (formatted.endsWith('.0')) {
            formatted = formatted.substring(0, formatted.length - 2);
        }
        return formatted.replace('.', ',') + 'k';
    }
    return num.toString();
}

const allCards = [

},
{

price:5000,

income3:32,
upgrade2Cost:10000,

},
{

image:"grafiki/R4.jpg",

price:7500,

},

},

// EPICKIE (ODBLOKOWYWANE PO REBIRTH 2)
{

image:"grafiki/E1.jpg",

price:3000,

upgrade3Cost:12000
},
{
name:"Doktor Dziwak",
image:"grafiki/E2.jpg",
rarity:"epicka",
price:5000,
income1:20,
income2:25,
income3:30,
upgrade2Cost:10000,
upgrade3Cost:20000
},
{
name:"Szkarłatna Wiedźma",
image:"grafiki/E3.jpg",
rarity:"epicka",
price:10000,
income1:30,
income2:35,
income3:40,
upgrade2Cost:20000,
upgrade3Cost:40000
},
{
name:"Wybrańcy Khonsu",
image:"grafiki/E4.jpg",
rarity:"epicka",
price:15000,
income1:40,
income2:45,
income3:50,
upgrade2Cost:30000,
upgrade3Cost:60000
},
{
name:"Liga Tropicieli",
image:"grafiki/E5.jpg",
rarity:"epicka",
price:20000,
income1:50,
income2:55,
income3:60,
upgrade2Cost:40000,
upgrade3Cost:80000
}
];

let currentShopMode = "zwykla"; // "zwykla", "rzadka" lub "epicka"

let player = JSON.parse(localStorage.getItem("tycoonData"));

if (!player) {
    player = {
        gold: 50,
        slotsUnlocked: 1,
        rareSlotsUnlocked: 0,
        epicSlotsUnlocked: 0,
        rebirthLevel: 0,
        ownedCards: [],
        shopCards: [],
        rareShopCards: [],
        epicShopCards: [],
        lastShopRefresh: ""
    };
}

// Konwersja starych zapisów ze zmienną hasRebirth na rebirthLevel
if (player.rebirthLevel === undefined) {
    player.rebirthLevel = player.hasRebirth ? 1 : 0;
}
if (player.rareSlotsUnlocked === undefined) player.rareSlotsUnlocked = 0;
if (player.epicSlotsUnlocked === undefined) player.epicSlotsUnlocked = 0;
if (!player.rareShopCards) player.rareShopCards = [];
if (!player.epicShopCards) player.epicShopCards = [];
if (!player.ownedCards) player.ownedCards = [];
if (!player.shopCards) player.shopCards = [];

function savePlayer() {
    localStorage.setItem("tycoonData", JSON.stringify(player));
}

function getToday() {
    return new Date().toDateString();
}

function randomCard(rarity = "zwykla") {
    const pool = allCards.filter(c => c.rarity === rarity);
    const roll = Math.random() * 100;

    if (roll < 40) {
        return JSON.parse(JSON.stringify(pool[0])); // 40%
    } else if (roll < 65) {
        return JSON.parse(JSON.stringify(pool[1])); // 25%
    } else if (roll < 85) {
        return JSON.parse(JSON.stringify(pool[2])); // 20%
    } else if (roll < 95) {
        return JSON.parse(JSON.stringify(pool[3])); // 10%
    } else {
        return JSON.parse(JSON.stringify(pool[4])); // 5%
    }
}

function refreshShop(){
    if(player.gold < 500){
        alert("Potrzebujesz 500 złota!");
        return;
    }

    if(!confirm("Odświeżyć sklep za 500 złota?")){
        return;
    }

    player.gold -= 500;

    if (currentShopMode === "zwykla") {
        player.shopCards = [];
        for(let i=0; i<3; i++){
            player.shopCards.push(randomCard("zwykla"));
        }
    } else if (currentShopMode === "rzadka") {
        player.rareShopCards = [];
        for(let i=0; i<3; i++){
            player.rareShopCards.push(randomCard("rzadka"));
        }
    } else {
        player.epicShopCards = [];
        for(let i=0; i<3; i++){
            player.epicShopCards.push(randomCard("epicka"));
        }
    }

    savePlayer();
    renderAll();
}

function generateShop() {
    const today = getToday();

    if (player.lastShopRefresh !== today || player.shopCards.length === 0) {
        
        player.shopCards = [];
        for(let i = 0; i < 3; i++){
            player.shopCards.push(randomCard("zwykla"));
        }

        if (player.rebirthLevel >= 1) {
            player.rareShopCards = [];
            for(let i = 0; i < 3; i++){
                player.rareShopCards.push(randomCard("rzadka"));
            }
        }

        if (player.rebirthLevel >= 2) {
            player.epicShopCards = [];
            for(let i = 0; i < 3; i++){
                player.epicShopCards.push(randomCard("epicka"));
            }
        }

        player.lastShopRefresh = today;
    }

    savePlayer();
}

function toggleShop() {
    if (player.rebirthLevel === 0) return;
    
    if (player.rebirthLevel === 1) {
        currentShopMode = (currentShopMode === "zwykla") ? "rzadka" : "zwykla";
    } else if (player.rebirthLevel >= 2) {
        if (currentShopMode === "zwykla") currentShopMode = "rzadka";
        else if (currentShopMode === "rzadka") currentShopMode = "epicka";
        else currentShopMode = "zwykla";
    }
    
    renderShop();
}

function doRebirth() {
    if (player.rebirthLevel === 0) {
        if(!confirm("Czy na pewno chcesz zrobić Rebirth 1? Twoje złoto zmieni się na 2k. Odblokujesz rzadkie karty, sloty i sklep!")){
            return;
        }
        player.rebirthLevel = 1;
        player.gold = 2000;

        if (player.rareShopCards.length === 0) {
            for(let i=0; i<3; i++){
                player.rareShopCards.push(randomCard("rzadka"));
            }
        }

        alert("Rebirth 1 ukończony! Odblokowano rzadkie karty!");

    } else if (player.rebirthLevel === 1) {
        if(!confirm("Czy na pewno chcesz zrobić Rebirth 2? Twoje złoto zmieni się na 10k! Odblokujesz epicki sklep, epickie sloty i dodatkowy 4. slot rzadki!")){
            return;
        }
        player.rebirthLevel = 2;
        player.gold = 10000;

        if (player.epicShopCards.length === 0) {
            for(let i=0; i<3; i++){
                player.epicShopCards.push(randomCard("epicka"));
            }
        }

        alert("Rebirth 2 ukończony! Odblokowano epicką zawartość!");
    } else {
        alert("Osiągnięto maksymalny poziom Rebirth!");
        return;
    }

    // Reset dochodu w kartach
    player.ownedCards.forEach(card => {
        card.lastCollected = Date.now();
    });

    savePlayer();
    renderAll();
}

function getCollectableGold(){
    let total = 0;
    player.ownedCards.forEach(card => {
        const now = Date.now();
        const periods = Math.floor((now - card.lastCollected) / (1 * 60 * 60 * 1000));
        if(periods > 0){
            total += periods * card.income;
        }
    });
    return total;
}

function renderGold() {
    document.getElementById("gold-info").innerHTML = `💰 Złoto: ${formatNumber(Math.floor(player.gold))}`;
}

function renderShop() {
    const shop = document.getElementById("shop");
    const shopTitle = document.getElementById("shop-type-title");
    const toggleBtn = document.getElementById("toggle-shop-btn");

    if (player.rebirthLevel >= 1) {
        toggleBtn.style.display = "inline-block";
        if (currentShopMode === "zwykla") shopTitle.innerText = "Zwykły";
        else if (currentShopMode === "rzadka") shopTitle.innerText = "Rzadki";
        else if (currentShopMode === "epicka") shopTitle.innerText = "Epicki";
    } else {
        toggleBtn.style.display = "none";
        shopTitle.innerText = "Zwykły";
    }

    shop.innerHTML = "";
    
    let activeCards = player.shopCards;
    if (currentShopMode === "rzadka") activeCards = player.rareShopCards;
    if (currentShopMode === "epicka") activeCards = player.epicShopCards;

    activeCards.forEach((card, index) => {
        shop.innerHTML += `
        <div class="card-entry ${card.rarity}">
            <img src="${card.image}" onerror="this.src='https://via.placeholder.com/150x180?text=Karta'">
            <h3>${card.name}</h3>
            <div>⭐ Lvl 1</div>
            <div>⚪ Rzadkość: ${card.rarity}</div>
            <div>💰 Cena: ${formatNumber(card.price)}</div>
            <div>📈 ${formatNumber(card.income1)} zł / h</div>
            <button class="buy-btn" onclick="buyCard(${index})">Kup</button>
        </div>
        `;
    });
}

function renderCollectButton(){
    const collectable = getCollectableGold();
    document.getElementById("collect-btn").innerHTML = `💰 Zbierz złoto (${formatNumber(collectable)})`;
}

function getCardValue(card){
    if(card.level === 1) return card.price;
    if(card.level === 2) return card.upgrade2Cost;
    if(card.level === 3) return card.upgrade3Cost;
    return card.price;
}

function renderSlots() {
    // Rendowanie Zwykłych Slotów (Maksymalnie 4 po Rebirth 1)
    const slotsNormal = document.getElementById("slots-normal");
    slotsNormal.innerHTML = "";

    const maxNormalSlots = player.rebirthLevel >= 1 ? 4 : 3;

    for(let i = 0; i < maxNormalSlots; i++) {
        if(i < player.slotsUnlocked){
            const card = player.ownedCards.filter(c => c.rarity === "zwykla")[i];

            if(card){
                const cardIndex = player.ownedCards.indexOf(card);
                let upgradeCost = card.level === 1 ? card.upgrade2Cost : card.upgrade3Cost;

                slotsNormal.innerHTML += `
                <div class="slot">
                    <div class="owned-card ${card.level === 2 ? 'level2' : ''} ${card.level === 3 ? 'level3' : ''}">
                        <img src="${card.image}" style="width:150px;height:200px;border-radius:6px;object-fit:cover;" onerror="this.src='https://via.placeholder.com/150x180?text=Karta'">
                        <h3>${card.name}</h3>
                        <div>⚪ Slot: Zwykły</div>
                        <div>⭐ Lvl ${card.level}</div>
                        <div>📈 ${formatNumber(card.income)} zł / h</div>
                        <div>💰 Wartość: ${formatNumber(getCardValue(card))} zł</div>
                        <div>💸 Sprzedaż: ${formatNumber(Math.floor(getCardValue(card)/2))} zł</div>
                        ${card.level < 3 ? `
                        <button onclick="upgradeCard(${cardIndex})" style="background:limegreen;color:white;">
                            ⬆️ Ulepsz (${formatNumber(upgradeCost)} zł)
                        </button>
                        ` : `<div style="color:gold;font-weight:bold;">⭐ MAX LVL</div>`}
                        <button onclick="sellCard(${cardIndex})" style="background:red;color:white;">Sprzedaj</button>
                    </div>
                </div>`;
            } else {
                slotsNormal.innerHTML += `<div class="slot"><div class="owned-card"><h3>Puste miejsce</h3><div>⚪ Slot: Zwykły</div></div></div>`;
            }
        } else {
            let cost = (i === 1) ? 10 : (i === 2) ? 25 : 5000;
            slotsNormal.innerHTML += `
            <div class="slot">
                <h3>🔒 Zablokowane</h3>
                <p>Koszt: ${formatNumber(cost)} złota</p>
                <button class="unlock-btn" onclick="unlockSlot(${i})">Odblokuj</button>
            </div>`;
        }
    }

    // Rendowanie Rzadkich Slotów (3 dla Rebirth 1, 4 dla Rebirth 2)
    const rareSection = document.getElementById("rare-slots-section");
    const slotsRare = document.getElementById("slots-rare");

    if (player.rebirthLevel >= 1) {
        rareSection.style.display = "block";
        slotsRare.innerHTML = "";

        const maxRareSlots = player.rebirthLevel >= 2 ? 4 : 3;
        const rareCosts = [1000, 5000, 10000, 2000];

        for(let i = 0; i < maxRareSlots; i++) {
            if(i < player.rareSlotsUnlocked){
                const card = player.ownedCards.filter(c => c.rarity === "rzadka")[i];

                if(card){
                    const cardIndex = player.ownedCards.indexOf(card);
                    let upgradeCost = card.level === 1 ? card.upgrade2Cost : card.upgrade3Cost;

                    slotsRare.innerHTML += `
                    <div class="slot rzadka">
                        <div class="owned-card rzadka ${card.level === 2 ? 'level2' : ''} ${card.level === 3 ? 'level3' : ''}">
                            <img src="${card.image}" style="width:150px;height:200px;border-radius:6px;object-fit:cover;" onerror="this.src='https://via.placeholder.com/150x180?text=Karta'">
                            <h3>${card.name}</h3>
                            <div>⭐ Slot: Rzadki</div>
                            <div>⭐ Lvl ${card.level}</div>
                            <div>📈 ${formatNumber(card.income)} zł / h</div>
                            <div>💰 Wartość: ${formatNumber(getCardValue(card))} zł</div>
                            <div>💸 Sprzedaż: ${formatNumber(Math.floor(getCardValue(card)/2))} zł</div>
                            ${card.level < 3 ? `
                            <button onclick="upgradeCard(${cardIndex})" style="background:limegreen;color:white;">
                                ⬆️ Ulepsz (${formatNumber(upgradeCost)} zł)
                            </button>
                            ` : `<div style="color:gold;font-weight:bold;">⭐ MAX LVL</div>`}
                            <button onclick="sellCard(${cardIndex})" style="background:red;color:white;">Sprzedaj</button>
                        </div>
                    </div>`;
                } else {
                    slotsRare.innerHTML += `<div class="slot rzadka"><div class="owned-card rzadka"><h3>Puste miejsce</h3><div>⭐ Slot: Rzadki</div></div></div>`;
                }
            } else {
                let cost = rareCosts[i];
                slotsRare.innerHTML += `
                <div class="slot rzadka">
                    <h3>🔒 Zablokowane</h3>
                    <p>Koszt: ${formatNumber(cost)} złota</p>
                    <button class="unlock-btn" onclick="unlockRareSlot(${i})">Odblokuj</button>
                </div>`;
            }
        }
    } else {
        rareSection.style.display = "none";
    }

    // Rendowanie Epickich Slotów (Dopiero po Rebirth 2)
    const epicSection = document.getElementById("epic-slots-section");
    const slotsEpic = document.getElementById("slots-epic");

    if (player.rebirthLevel >= 2) {
        epicSection.style.display = "block";
        slotsEpic.innerHTML = "";

        const epicCosts = [1000, 5000, 10000];

        for(let i = 0; i < 3; i++) {
            if(i < player.epicSlotsUnlocked){
                const card = player.ownedCards.filter(c => c.rarity === "epicka")[i];

                if(card){
                    const cardIndex = player.ownedCards.indexOf(card);
                    let upgradeCost = card.level === 1 ? card.upgrade2Cost : card.upgrade3Cost;

                    slotsEpic.innerHTML += `
                    <div class="slot epicka">
                        <div class="owned-card epicka ${card.level === 2 ? 'level2' : ''} ${card.level === 3 ? 'level3' : ''}">
                            <img src="${card.image}" style="width:150px;height:200px;border-radius:6px;object-fit:cover;" onerror="this.src='https://via.placeholder.com/150x180?text=Karta'">
                            <h3>${card.name}</h3>
                            <div>🔮 Slot: Epicki</div>
                            <div>⭐ Lvl ${card.level}</div>
                            <div>📈 ${formatNumber(card.income)} zł / h</div>
                            <div>💰 Wartość: ${formatNumber(getCardValue(card))} zł</div>
                            <div>💸 Sprzedaż: ${formatNumber(Math.floor(getCardValue(card)/2))} zł</div>
                            ${card.level < 3 ? `
                            <button onclick="upgradeCard(${cardIndex})" style="background:limegreen;color:white;">
                                ⬆️ Ulepsz (${formatNumber(upgradeCost)} zł)
                            </button>
                            ` : `<div style="color:gold;font-weight:bold;">⭐ MAX LVL</div>`}
                            <button onclick="sellCard(${cardIndex})" style="background:red;color:white;">Sprzedaj</button>
                        </div>
                    </div>`;
                } else {
                    slotsEpic.innerHTML += `<div class="slot epicka"><div class="owned-card epicka"><h3>Puste miejsce</h3><div>🔮 Slot: Epicki</div></div></div>`;
                }
            } else {
                let cost = epicCosts[i];
                slotsEpic.innerHTML += `
                <div class="slot epicka">
                    <h3>🔒 Zablokowane</h3>
                    <p>Koszt: ${formatNumber(cost)} złota</p>
                    <button class="unlock-btn" onclick="unlockEpicSlot(${i})">Odblokuj</button>
                </div>`;
            }
        }
    } else {
        epicSection.style.display = "none";
    }
}

function unlockSlot(slotIndex){
    const cost = (slotIndex === 1) ? 10 : (slotIndex === 2) ? 25 : 5000;

    if(player.gold < cost){
        alert("Za mało złota!");
        return;
    }

    player.gold -= cost;
    player.slotsUnlocked++;
    savePlayer();
    renderAll();
}

function unlockRareSlot(slotIndex){
    const rareCosts = [1000, 5000, 10000, 2000];
    const cost = rareCosts[slotIndex];

    if(player.gold < cost){
        alert("Za mało złota!");
        return;
    }

    player.gold -= cost;
    player.rareSlotsUnlocked++;
    savePlayer();
    renderAll();
}

function unlockEpicSlot(slotIndex){
    const epicCosts = [1000, 5000, 10000];
    const cost = epicCosts[slotIndex];

    if(player.gold < cost){
        alert("Za mało złota!");
        return;
    }

    player.gold -= cost;
    player.epicSlotsUnlocked++;
    savePlayer();
    renderAll();
}

function buyCard(index){
    let activeShop = player.shopCards;
    if (currentShopMode === "rzadka") activeShop = player.rareShopCards;
    if (currentShopMode === "epicka") activeShop = player.epicShopCards;

    const card = activeShop[index];

    const normalCardsCount = player.ownedCards.filter(c => c.rarity === "zwykla").length;
    const rareCardsCount = player.ownedCards.filter(c => c.rarity === "rzadka").length;
    const epicCardsCount = player.ownedCards.filter(c => c.rarity === "epicka").length;

    if (card.rarity === "zwykla" && normalCardsCount >= player.slotsUnlocked) {
        alert("Brak wolnego zwykłego miejsca!");
        return;
    }

    if (card.rarity === "rzadka" && rareCardsCount >= player.rareSlotsUnlocked) {
        alert("Brak wolnego rzadkiego miejsca!");
        return;
    }

    if (card.rarity === "epicka" && epicCardsCount >= player.epicSlotsUnlocked) {
        alert("Brak wolnego epickiego miejsca!");
        return;
    }

    if(player.gold < card.price){
        alert("Za mało złota!");
        return;
    }

    player.gold -= card.price;

    player.ownedCards.push({
        name: card.name,
        image: card.image,
        rarity: card.rarity,
        income: card.income1,
        income1: card.income1,
        income2: card.income2,
        income3: card.income3,
        upgrade2Cost: card.upgrade2Cost,
        upgrade3Cost: card.upgrade3Cost,
        price: card.price,
        level: 1,
        lastCollected: Date.now()
    });

    activeShop[index] = randomCard(card.rarity);

    savePlayer();
    renderAll();
}

function sellCard(slotIndex){
    const card = player.ownedCards[slotIndex];
    if(!card) return;

    let goldBack = Math.floor(getCardValue(card) / 2);

    if(confirm(`Sprzedać ${card.name} (Lv.${card.level}) za ${formatNumber(goldBack)} złota?`)){
        player.gold += goldBack;
        player.ownedCards.splice(slotIndex, 1);
        savePlayer();
        renderAll();
    }
}

function upgradeCard(slotIndex){
    const card = player.ownedCards[slotIndex];
    if(!card) return;

    let cost = (card.level === 1) ? card.upgrade2Cost : (card.level === 2) ? card.upgrade3Cost : 0;

    if(cost === 0){
        alert("Maksymalny poziom!");
        return;
    }

    if(player.gold < cost){
        alert("Za mało złota!");
        return;
    }

    player.gold -= cost;
    card.level++;

    if(card.level === 2) card.income = card.income2;
    else if(card.level === 3) card.income = card.income3;

    savePlayer();
    renderAll();

    alert(`${card.name} ulepszono na poziom ${card.level}!`);
}

function collectGold(){
    let total = 0;

    player.ownedCards.forEach(card => {
        const now = Date.now();
        const periods = Math.floor((now - card.lastCollected) / (1 * 60 * 60 * 1000));

        if(periods > 0){
            const earned = periods * card.income;
            total += earned;
            card.lastCollected += periods * (1 * 60 * 60 * 1000);
        }
    });

    player.gold += total;

    if(total > 0){
        alert(`Odebrano ${formatNumber(total)} złota!`);
    } else {
        alert("Karty jeszcze nic nie zarobiły.");
    }

    savePlayer();
    renderAll();
}

function getTotalIncome() {
    let total = 0;
    player.ownedCards.forEach(card => {
        total += card.income;
    });
    return total;
}

function renderIncome() {
    const income = getTotalIncome();
    document.getElementById("income-info").innerHTML = 
        `📈 Przychód: ${formatNumber(income)} zł / h`;
}

function renderAll(){
    renderGold();
    renderCollectButton();
    renderIncome();
    renderShop();
    renderSlots();

    // Wygląd i obsługa przycisku Rebirth zależnie od poziomu
    const rebirthBtn = document.getElementById("rebirth-btn");
    if (player.rebirthLevel === 0) {
        rebirthBtn.disabled = false;
        rebirthBtn.innerText = "🔄 Rebirth 1";
        rebirthBtn.style.background = "#e74c3c";
        rebirthBtn.style.cursor = "pointer";
    } else if (player.rebirthLevel === 1) {
        rebirthBtn.disabled = false;
        rebirthBtn.innerText = "🔄 Rebirth 2";
        rebirthBtn.style.background = "#9b59b6"; // fioletowy kolor
        rebirthBtn.style.cursor = "pointer";
    } else {
        rebirthBtn.disabled = true;
        rebirthBtn.innerText = "✅ Max Rebirth";
        rebirthBtn.style.background = "#7f8c8d";
        rebirthBtn.style.cursor = "not-allowed";
        rebirthBtn.style.boxShadow = "none";
    }
}

setInterval(() => {
    renderCollectButton();
}, 1000);

generateShop();
renderAll();

</script>

</body>
</html>
